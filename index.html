<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Doc Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Sticky Navigation */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Glassmorphism Panel */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: white;
            padding: 2rem;
            margin-top: 2rem;
        }
        textarea {
            background: rgba(0, 0, 0, 0.4) !important;
            color: #00ffcc !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            font-family: monospace;
        }
        .output-box {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 300px;
            white-space: pre-wrap; /* Keeps markdown spacing */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-nav py-3">
        <div class="container text-white">
            <h4 class="mb-0">⚙️ AI Documentation Agent</h4>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="glass-card">
                    <h5 class="mb-3">Paste Python Code Below</h5>
                    
                    <textarea id="codeInput" class="form-control mb-3" rows="8" placeholder="def my_function():..."></textarea>
                    
                    <button id="generateBtn" class="btn btn-light px-4 py-2 fw-bold" onclick="generateDocs()">
                        Generate Docs ✨
                    </button>

                    <hr class="my-4" style="border-color: rgba(255,255,255,0.2);">

                    <h5 class="mb-3">Markdown Output</h5>
                    <div id="outputArea" class="output-box shadow-sm">
                        Output will appear here...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateDocs() {
            const code = document.getElementById('codeInput').value;
            const outputArea = document.getElementById('outputArea');
            const btn = document.getElementById('generateBtn');

            if (!code.trim()) {
                alert("Please enter some code first.");
                return;
            }

            btn.innerText = "Analyzing...";
            btn.disabled = true;
            outputArea.innerText = "Connecting to Python Backend...";

            try {
                // Call the FastAPI Python Server
                const response = await fetch("http://127.0.0.1:8000/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();
                outputArea.innerText = data.result; // Display the Markdown
                
            } catch (error) {
                outputArea.innerText = "Error connecting to the backend. Is api.py running?";
            } finally {
                btn.innerText = "Generate Docs ✨";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
